name: Collect Institutional Radar Snapshot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collect market & whale snapshot
        run: node scripts/collect.mjs

      - name: Commit updated snapshot & history
        run: |
          git config user.name "radar-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar-snapshot.json history/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(radar): update snapshot $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
